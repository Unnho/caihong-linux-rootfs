#
# Memory, I/O and watchdog tuning for the Caihong tablet.  Imported from
# Armada OS (system_files/usr/lib/sysctl.d/60-armada-gaming.conf) and ROCKNIX
# (projects/ROCKNIX/packages/sysutils/systemd/sysctl.d/60-rocknix.conf), then
# adapted to the zstd zram swap device brought up by caihong-zram.service.
#
# Lines prefixed with '-' are ignored when the kernel exposes no such knob.

# Swap aggressively into the compressed zram device instead of reclaiming.
vm.swappiness=180
vm.page-cluster=0

# Writeback and watermark behaviour for the single fast UFS device.
vm.watermark_boost_factor=0
vm.watermark_scale_factor=125
vm.dirty_bytes=268435456
vm.dirty_background_bytes=67108864
vm.dirty_writeback_centisecs=1500

vm.max_map_count=2147483642

# Nothing services the hardware watchdog, so it only costs wakeups.
-kernel.nmi_watchdog=0
-kernel.soft_watchdog=0
-kernel.watchdog=0

fs.inotify.max_user_instances=1024
fs.inotify.max_user_watches=524288

# Use BBR when its module is present; keep IPv6 router advertisements even
# though the tablet may forward traffic for the USB gadget.
-net.ipv4.tcp_congestion_control=bbr
-net.ipv6.conf.all.accept_ra=2
-net.ipv6.conf.default.accept_ra=2
