#
# Imported from Armada OS
# (system_files/etc/UPower/UPower.conf.d/70-armada-low-battery.conf).
#
# UPower's automatic critical action resolves to suspend on these devices, and
# SM8650 s2idle is not reliable yet (ROCKNIX disables sleep on SM8650 outright),
# so power the tablet off at the critical level instead of draining to a
# brown-out.  Caihong's charge driver keeps its own stop-charging policy across
# suspend, so this only changes what happens when the battery is nearly empty.
[UPower]
PercentageLow=15.0
PercentageCritical=6.0
PercentageAction=3.0
CriticalPowerAction=PowerOff
