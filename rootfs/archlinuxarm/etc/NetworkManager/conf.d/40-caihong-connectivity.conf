#
# Imported from Armada OS
# (system_files/etc/NetworkManager/conf.d/99-armada-dhcp-timeout.conf).
# DHCP frequently fails on the first attempt on these devices, so shorten the
# timeout to make NetworkManager retry sooner.
[connection]
ipv4.dhcp-timeout=10
