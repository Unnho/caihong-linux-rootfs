name: Build and publish Caihong Linux releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create or update
        required: true
        default: v0.1.0
      publish_release:
        description: Publish the completed build as a GitHub release
        required: true
        type: boolean
        default: false
      distributions:
        description: Comma-separated distributions to build
        required: true
        default: archlinuxarm,armada,debian,rocknix

permissions:
  contents: write
  packages: read

concurrency:
  group: caihong-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      distributions: ${{ steps.select.outputs.distributions }}
      archlinuxarm: ${{ steps.select.outputs.archlinuxarm }}
      armada: ${{ steps.select.outputs.armada }}
      debian: ${{ steps.select.outputs.debian }}
      rocknix: ${{ steps.select.outputs.rocknix }}
    steps:
      - name: Select distributions
        id: select
        env:
          REQUESTED: ${{ inputs.distributions || 'archlinuxarm,armada,debian,rocknix' }}
        run: |
          set -euo pipefail
          all=(archlinuxarm armada debian rocknix)
          declare -A wanted=()
          IFS=, read -ra items <<< "$REQUESTED"
          for item in "${items[@]}"; do
            item=${item//[[:space:]]/}
            [[ -n $item ]] || continue
            known=0
            for name in "${all[@]}"; do
              [[ $item == "$name" ]] && known=1
            done
            (( known )) || { echo "unknown distribution: $item" >&2; exit 1; }
            wanted[$item]=1
          done
          selected=()
          for name in "${all[@]}"; do
            if [[ -n ${wanted[$name]:-} ]]; then
              selected+=("$name")
              echo "$name=true" >> "$GITHUB_OUTPUT"
            else
              echo "$name=false" >> "$GITHUB_OUTPUT"
            fi
          done
          (( ${#selected[@]} )) || { echo "no distributions selected" >&2; exit 1; }
          printf 'distributions=%s\n' "$(IFS=,; echo "${selected[*]}")" >> "$GITHUB_OUTPUT"
          matrix=$(printf '"%s",' "${selected[@]}")
          printf 'matrix=[%s]\n' "${matrix%,}" >> "$GITHUB_OUTPUT"

  build-kernel:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    outputs:
      kernel_release: ${{ steps.build-kernel.outputs.kernel_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            alsa-utils android-sdk-libsparse-utils bc bison build-essential \
            ccache curl dwarves e2fsprogs file flex git kmod libarchive-tools \
            libegl-dev libelf-dev libgbm-dev libgles-dev libdrm-dev \
            libssl-dev libva-dev meson mmdebstrap ninja-build pkg-config \
            python3 rpm rsync shellcheck skopeo squashfs-tools umoci zstd \
            debian-archive-keyring

      - name: Restore package downloads
        uses: actions/cache@v4
        with:
          path: |
            downloads
            build/pacman-cache
          key: archlinuxarm-${{ runner.os }}-${{ hashFiles('config/dependencies.env', 'scripts/package-archlinuxarm-rootfs.sh') }}
          restore-keys: archlinuxarm-${{ runner.os }}-

      - name: Resolve component branches
        run: scripts/checkout-dependencies.sh

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('config/dependencies.env', 'linux/arch/arm64/configs/caihong_defconfig') }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('config/dependencies.env', 'linux/arch/arm64/configs/caihong_defconfig') }}-
            ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure compiler cache
        run: |
          ccache --max-size=2G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache --zero-stats

      - name: Build direct-root kernel and boot images
        run: |
          jobs=$(nproc)
          JOBS=$jobs ZSTD_THREADS=$jobs FORCE=1 \
            KERNEL_CC="ccache gcc" KERNEL_HOSTCC="ccache gcc" \
          scripts/build-kernel-release.sh

      - name: Build Armada kernel RPM
        if: needs.prepare.outputs.armada == 'true'
        run: scripts/build-linux-caihong-rpm.sh modules-current release

      - name: Build Debian kernel DEB
        if: needs.prepare.outputs.debian == 'true'
        run: scripts/build-linux-caihong-deb.sh modules-current release

      - name: Build Arch Linux ARM platform package
        if: needs.prepare.outputs.archlinuxarm == 'true'
        run: |
          sudo -E env PATH="$PATH" \
            DISTRIBUTION=archlinuxarm scripts/build-caihong-platform-package.sh release

      - name: Build Armada platform package
        if: needs.prepare.outputs.armada == 'true'
        run: |
          sudo -E env PATH="$PATH" \
            DISTRIBUTION=armada LIBDIR=lib64 \
            scripts/build-caihong-platform-package.sh release

      - name: Build Debian platform package
        if: needs.prepare.outputs.debian == 'true'
        run: |
          sudo -E env PATH="$PATH" \
            DISTRIBUTION=debian scripts/build-caihong-platform-package.sh release

      - name: Build ROCKNIX platform package
        if: needs.prepare.outputs.rocknix == 'true'
        run: |
          sudo -E env PATH="$PATH" \
            DISTRIBUTION=rocknix scripts/build-caihong-platform-package.sh release

      - name: Verify device packages
        id: build-kernel
        run: |
          sudo chown -R "$USER:$USER" release
          scripts/verify-caihong-update-packages.sh release \
            "${{ needs.prepare.outputs.distributions }}"
          kernel_release=$(cat release/KERNEL_RELEASE)
          printf 'kernel_release=%s\n' "$kernel_release" >> "$GITHUB_OUTPUT"

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Save compiler cache
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('config/dependencies.env', 'linux/arch/arm64/configs/caihong_defconfig') }}-${{ github.run_id }}

      - name: Free kernel build space
        run: rm -rf .ccache linux build/linux

      - name: Cache kernel and update payload
        uses: actions/cache/save@v4
        with:
          key: caihong-build-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release
            build/dependencies.resolved.env

      - name: Cache matching module tree
        uses: actions/cache/save@v4
        with:
          key: caihong-modules-${{ github.run_id }}-${{ github.run_attempt }}
          path: modules-current

  build-rootfs:
    name: Build ${{ matrix.distribution }} rootfs
    runs-on: ubuntu-24.04-arm
    needs: [prepare, build-kernel]
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        distribution: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            alsa-utils android-sdk-libsparse-utils bc bison build-essential \
            ccache curl dwarves e2fsprogs file flex git kmod libarchive-tools \
            libegl-dev libelf-dev libgbm-dev libgles-dev libdrm-dev \
            libssl-dev libva-dev meson mmdebstrap ninja-build pkg-config python3 rpm rsync \
            shellcheck squashfs-tools zstd debian-archive-keyring

      - name: Restore package downloads
        if: matrix.distribution == 'archlinuxarm'
        uses: actions/cache@v4
        with:
          path: |
            downloads
            build/pacman-cache
          key: archlinuxarm-${{ runner.os }}-${{ hashFiles('config/dependencies.env', 'scripts/package-archlinuxarm-rootfs.sh') }}
          restore-keys: archlinuxarm-${{ runner.os }}-

      - name: Restore ROCKNIX payload
        if: matrix.distribution == 'rocknix'
        uses: actions/cache@v4
        with:
          path: downloads/ROCKNIX-*
          key: rocknix-${{ runner.os }}-${{ hashFiles('config/rocknix.env') }}
          restore-keys: rocknix-${{ runner.os }}-

      - name: Install Armada dependencies
        if: matrix.distribution == 'armada'
        run: |
          sudo apt-get install -y m4 meson ninja-build skopeo umoci

      - name: Resolve component branches
        run: scripts/checkout-dependencies.sh

      - name: Restore build inputs
        uses: actions/cache/restore@v4
        with:
          key: caihong-build-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release
            build/dependencies.resolved.env
          fail-on-cache-miss: true

      - name: Restore matching module tree
        uses: actions/cache/restore@v4
        with:
          key: caihong-modules-${{ github.run_id }}-${{ github.run_attempt }}
          path: modules-current
          fail-on-cache-miss: true

      - name: Restore build inputs
        run: |
          sudo chown -R "$USER:$USER" release
          chmod -R u+rwX release
          kernel_release=$(cat release/KERNEL_RELEASE)
          test "$kernel_release" = "${{ needs.build-kernel.outputs.kernel_release }}"
          test -d "modules-current/lib/modules/$kernel_release"

      - name: Build Arch Linux ARM rootfs
        if: matrix.distribution == 'archlinuxarm'
        run: |
          jobs=$(nproc)
          kernel_release=$(cat release/KERNEL_RELEASE)
          sudo -E env \
            CHROOT_TOOL=chroot \
            KERNEL_PACKAGE="$PWD/release/$(cat release/LINUX_CAIHONG_PACKAGE)" \
            CAIHONG_PLATFORM_PACKAGE="$PWD/release/$(cat release/CAIHONG_PLATFORM_PACKAGE_ARCHLINUXARM)" \
            LIBCAMERA_BUILD_JOBS="$jobs" \
            MODULE_TREE="$PWD/modules-current" \
            OUTPUT_FORMAT=ext4 \
            PLASMA_CAMERA_BUILD_JOBS="$jobs" \
            SPARSE_IMAGE=1 \
            USE_PROXY=0 \
            scripts/package-archlinuxarm-rootfs.sh \
            "release/caihong-rootfs-$kernel_release.ext4.sparse.img"
          sudo chown -R "$USER:$USER" release build/pacman-cache downloads


      - name: Build Armada rootfs
        if: matrix.distribution == 'armada'
        run: |
          kernel_release=$(cat release/KERNEL_RELEASE)
          sudo -E env \
            ARMADA_IMAGE=ghcr.io/armada-os/armada:stable \
            MODULE_TREE="$PWD/modules-current" \
            RELEASE_DIR="$PWD/release" \
            KERNEL_RPM="$PWD/release/$(cat release/LINUX_CAIHONG_RPM)" \
            CAIHONG_PLATFORM_PACKAGE="$PWD/release/$(cat release/CAIHONG_PLATFORM_PACKAGE_ARMADA)" \
            SPARSE_IMAGE=1 \
            scripts/package-armada-rootfs.sh \
            "release/caihong-armada-rootfs-$kernel_release.ext4.sparse.img"
          sudo chown -R "$USER:$USER" release

      - name: Build Debian rootfs
        if: matrix.distribution == 'debian'
        run: |
          kernel_release=$(cat release/KERNEL_RELEASE)
          sudo -E env \
            KERNEL_DEB="$PWD/release/$(cat release/LINUX_CAIHONG_DEB)" \
            CAIHONG_PLATFORM_PACKAGE="$PWD/release/$(cat release/CAIHONG_PLATFORM_PACKAGE_DEBIAN)" \
            MODULE_TREE="$PWD/modules-current" \
            RELEASE_DIR="$PWD/release" \
            SPARSE_IMAGE=1 \
            scripts/package-debian-rootfs.sh \
            "release/caihong-debian-rootfs-$kernel_release.ext4.sparse.img"
          sudo chown -R "$USER:$USER" release

      - name: Build ROCKNIX rootfs
        if: matrix.distribution == 'rocknix'
        run: |
          kernel_release=$(cat release/KERNEL_RELEASE)
          sudo -E env \
            CAIHONG_PLATFORM_PACKAGE="$PWD/release/$(cat release/CAIHONG_PLATFORM_PACKAGE_ROCKNIX)" \
            MODULE_TREE="$PWD/modules-current" \
            RELEASE_DIR="$PWD/release" \
            IMAGE_MIN_FREE_MIB=512 \
            IMAGE_SLACK_PERCENT=5 \
            SPARSE_IMAGE=1 \
            scripts/package-rocknix-rootfs.sh \
            "release/caihong-rocknix-rootfs-$kernel_release.ext4.sparse.img"
          sudo chown -R "$USER:$USER" release downloads

      - name: Cache rootfs build
        uses: actions/cache/save@v4
        with:
          key: caihong-rootfs-${{ matrix.distribution }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/*rootfs-*.ext4.sparse.img

  publish:
    runs-on: ubuntu-24.04-arm
    needs: [prepare, build-kernel, build-rootfs]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install release dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 zstd

      - name: Restore build inputs
        uses: actions/cache/restore@v4
        with:
          key: caihong-build-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release
            build/dependencies.resolved.env
          fail-on-cache-miss: true

      - name: Restore release permissions
        run: |
          sudo chown -R "$USER:$USER" release
          chmod -R u+rwX release

      - name: Restore and prepare Arch rootfs
        if: needs.prepare.outputs.archlinuxarm == 'true'
        uses: actions/cache/restore@v4
        with:
          key: caihong-rootfs-archlinuxarm-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/*rootfs-*.ext4.sparse.img
          fail-on-cache-miss: true

      - name: Prepare Arch release assets
        if: needs.prepare.outputs.archlinuxarm == 'true'
        run: |
          kernel_release=$(cat release/KERNEL_RELEASE)
          scripts/prepare-release-assets.py \
            --release-dir release \
            --distribution archlinuxarm \
            --rootfs "release/caihong-rootfs-$kernel_release.ext4.sparse.img" \
            --dependencies build/dependencies.resolved.env \
            --assets release/assets \
            --notes release/ARCH_NOTES.md \
            --manifest release/arch-release-manifest.json \
            --checksums release/SHA256SUMS.arch
          rm -f "release/caihong-rootfs-$kernel_release.ext4.sparse.img" \
            "release/caihong-rootfs-$kernel_release.ext4.sparse.img.zst"

      - name: Restore Armada rootfs
        if: needs.prepare.outputs.armada == 'true'
        uses: actions/cache/restore@v4
        with:
          key: caihong-rootfs-armada-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/*rootfs-*.ext4.sparse.img
          fail-on-cache-miss: true

      - name: Prepare Armada release assets
        if: needs.prepare.outputs.armada == 'true'
        run: |
          kernel_release=$(cat release/KERNEL_RELEASE)
          scripts/prepare-release-assets.py \
            --release-dir release \
            --distribution armada \
            --rootfs "release/caihong-armada-rootfs-$kernel_release.ext4.sparse.img" \
            --dependencies build/dependencies.resolved.env \
            --assets release/armada-assets \
            --notes release/ARMADA_NOTES.md \
            --manifest release/armada-release-manifest.json \
            --checksums release/SHA256SUMS.armada
          rm -f "release/caihong-armada-rootfs-$kernel_release.ext4.sparse.img" \
            "release/caihong-armada-rootfs-$kernel_release.ext4.sparse.img.zst"

      - name: Restore Debian rootfs
        if: needs.prepare.outputs.debian == 'true'
        uses: actions/cache/restore@v4
        with:
          key: caihong-rootfs-debian-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/*rootfs-*.ext4.sparse.img
          fail-on-cache-miss: true

      - name: Prepare Debian release assets
        if: needs.prepare.outputs.debian == 'true'
        run: |
          kernel_release=$(cat release/KERNEL_RELEASE)
          scripts/prepare-release-assets.py \
            --release-dir release \
            --distribution debian \
            --rootfs "release/caihong-debian-rootfs-$kernel_release.ext4.sparse.img" \
            --dependencies build/dependencies.resolved.env \
            --assets release/debian-assets \
            --notes release/DEBIAN_NOTES.md \
            --manifest release/debian-release-manifest.json \
            --checksums release/SHA256SUMS.debian
          rm -f "release/caihong-debian-rootfs-$kernel_release.ext4.sparse.img" \
            "release/caihong-debian-rootfs-$kernel_release.ext4.sparse.img.zst"

      - name: Restore ROCKNIX rootfs
        if: needs.prepare.outputs.rocknix == 'true'
        uses: actions/cache/restore@v4
        with:
          key: caihong-rootfs-rocknix-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/*rootfs-*.ext4.sparse.img
          fail-on-cache-miss: true

      - name: Prepare ROCKNIX release assets
        if: needs.prepare.outputs.rocknix == 'true'
        run: |
          kernel_release=$(cat release/KERNEL_RELEASE)
          scripts/prepare-release-assets.py \
            --release-dir release \
            --distribution rocknix \
            --rootfs "release/caihong-rocknix-rootfs-$kernel_release.ext4.sparse.img" \
            --dependencies build/dependencies.resolved.env \
            --assets release/rocknix-assets \
            --notes release/ROCKNIX_NOTES.md \
            --manifest release/rocknix-release-manifest.json \
            --checksums release/SHA256SUMS.rocknix
          rm -f "release/caihong-rocknix-rootfs-$kernel_release.ext4.sparse.img" \
            "release/caihong-rocknix-rootfs-$kernel_release.ext4.sparse.img.zst"

      - name: Assemble publishable release assets
        env:
          SELECTED: ${{ needs.prepare.outputs.distributions }}
        run: |
          set -euo pipefail
          mkdir -p release/assets
          IFS=, read -ra selected <<< "$SELECTED"

          for directory in "${selected[@]}"; do
            [[ -d "release/${directory}-assets" ]] || continue
            for source in "release/${directory}-assets"/*; do
              target=release/assets/${source##*/}
              if [[ -e $target ]]; then
                case ${source##*/} in
                  caihong-boot-*.img) cmp "$source" "$target" ;;
                  *)
                    echo "unexpected duplicate release asset: ${source##*/}" >&2
                    exit 1
                    ;;
                esac
                rm "$source"
              else
                mv "$source" "$target"
              fi
            done
            rmdir "release/${directory}-assets"
          done

          require_min()
          {
            local description=$1 minimum=$2
            shift 2
            if (( $# < minimum )); then
              echo "${description}: expected at least ${minimum}, found $#" >&2
              exit 1
            fi
          }

          require_exact()
          {
            local description=$1 expected=$2
            shift 2
            if (( $# != expected )); then
              echo "${description}: expected ${expected}, found $#" >&2
              exit 1
            fi
          }

          shopt -s nullglob
          boot=(release/assets/caihong-boot-*.img)
          arch_rootfs=(release/assets/caihong-rootfs-*.ext4.sparse.img.zst*)
          armada_rootfs=(release/assets/caihong-armada-rootfs-*.ext4.sparse.img.zst*)
          debian_rootfs=(release/assets/caihong-debian-rootfs-*.ext4.sparse.img.zst*)
          rocknix_rootfs=(release/assets/caihong-rocknix-rootfs-*.ext4.sparse.img.zst*)
          pacman=(release/assets/linux-caihong-*-aarch64.pkg.tar.zst)
          rpm=(release/assets/linux-caihong-*-1.aarch64.rpm)
          deb=(release/assets/linux-caihong_*_arm64.deb)
          platform_pacman=(release/assets/caihong-platform-*-aarch64.pkg.tar.zst)
          platform_rpm=(release/assets/caihong-platform-*-1.aarch64.rpm)
          platform_deb=(release/assets/caihong-platform_*_arm64.deb)
          platform_rocknix=(release/assets/caihong-platform-*-1-rocknix.tar.zst)
          require_exact 'boot images' 2 "${boot[@]}"
          for name in "${selected[@]}"; do
            case $name in
              archlinuxarm)
                require_min 'Arch rootfs image' 1 "${arch_rootfs[@]}"
                require_exact 'Arch kernel package' 1 "${pacman[@]}"
                require_exact 'Arch platform package' 1 "${platform_pacman[@]}"
                ;;
              armada)
                require_min 'Armada rootfs image' 1 "${armada_rootfs[@]}"
                require_exact 'Armada kernel package' 1 "${rpm[@]}"
                require_exact 'Armada platform package' 1 "${platform_rpm[@]}"
                ;;
              debian)
                require_min 'Debian rootfs image' 1 "${debian_rootfs[@]}"
                require_exact 'Debian kernel package' 1 "${deb[@]}"
                require_exact 'Debian platform package' 1 "${platform_deb[@]}"
                ;;
              rocknix)
                require_min 'ROCKNIX rootfs image' 1 "${rocknix_rootfs[@]}"
                require_exact 'ROCKNIX platform package' 1 "${platform_rocknix[@]}"
                ;;
            esac
          done
          for asset in release/assets/*; do
            case ${asset##*/} in
              caihong-boot-*.img|\
              caihong-rootfs-*.ext4.sparse.img.zst*|\
              caihong-armada-rootfs-*.ext4.sparse.img.zst*|\
              caihong-debian-rootfs-*.ext4.sparse.img.zst*|\
              caihong-rocknix-rootfs-*.ext4.sparse.img.zst*|\
              linux-caihong-*-aarch64.pkg.tar.zst|\
              linux-caihong-*-1.aarch64.rpm|\
              linux-caihong_*_arm64.deb|\
              caihong-platform-*-aarch64.pkg.tar.zst|\
              caihong-platform-*-1.aarch64.rpm|\
              caihong-platform_*_arm64.deb|\
              caihong-platform-*-1-rocknix.tar.zst) ;;
              *)
                echo "unexpected published release asset: ${asset##*/}" >&2
                exit 1
                ;;
            esac
          done

          {
            for name in "${selected[@]}"; do
              case $name in
                archlinuxarm) title='Arch Linux ARM'; notes=ARCH_NOTES.md ;;
                armada) title='Armada'; notes=ARMADA_NOTES.md ;;
                debian) title='Debian'; notes=DEBIAN_NOTES.md ;;
                rocknix) title='ROCKNIX'; notes=ROCKNIX_NOTES.md ;;
              esac
              printf '%s\n\n' "## $title"
              cat "release/$notes"
            done
          } > release/RELEASE_NOTES.md

      - name: Install artifact uploader
        run: |
          npm install --prefix build/artifact-uploader --no-save --package-lock=false \
            --ignore-scripts --no-audit --no-fund @actions/artifact@6.3.1

      - name: Upload individual release files without ZIP wrapping
        uses: actions/github-script@v8
        with:
          script: |
            const {pathToFileURL} = require('node:url');
            const {resolve} = require('node:path');
            const load = relative => import(pathToFileURL(resolve(process.env.GITHUB_WORKSPACE, relative)).href);
            const {DefaultArtifactClient} = await load('build/artifact-uploader/node_modules/@actions/artifact/lib/artifact.js');
            const {uploadReleaseArtifacts} = await load('scripts/upload-release-artifacts.mjs');
            const artifacts = await uploadReleaseArtifacts(new DefaultArtifactClient(), 'release/assets');
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await core.summary.addHeading('按需下载构建产物').addList(artifacts.map(artifact =>
              `<a href="${run}/artifacts/${artifact.id}">${artifact.name}</a>`
            )).write();

      - name: Publish GitHub release
        if: github.event_name == 'push' || inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            tag=$GITHUB_REF_NAME
          else
            tag=$INPUT_TAG
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/assets/* --clobber
            declare -A current_assets=()
            for path in release/assets/*; do
              current_assets["${path##*/}"]=1
            done
            while IFS= read -r asset; do
              case "$asset" in
                caihong-boot-*|caihong-rootfs-*|caihong-armada-rootfs-*|caihong-debian-rootfs-*|caihong-rocknix-rootfs-*|linux-caihong-*|linux-caihong_*|caihong-platform-*|caihong-platform_*|caihong-npu-*|caihong-armada-release-manifest.json|arch-release-manifest.json|armada-release-manifest.json|debian-release-manifest.json|rocknix-release-manifest.json|SHA256SUMS.arch|SHA256SUMS.armada|SHA256SUMS.debian|SHA256SUMS.rocknix|ARMADA_NOTES.md|DEBIAN_NOTES.md|ROCKNIX_NOTES.md)
                  if [[ -z ${current_assets[$asset]+present} ]]; then
                    gh release delete-asset "$tag" "$asset" --yes
                  fi
                  ;;
              esac
            done < <(gh release view "$tag" --json assets --jq '.assets[].name')
            gh release edit "$tag" \
              --title "Caihong Linux $tag" \
              --notes-file release/RELEASE_NOTES.md
          else
            gh release create "$tag" release/assets/* \
              --title "Caihong Linux $tag" \
              --notes-file release/RELEASE_NOTES.md
          fi
